<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đố Kinh Thánh — Tạm đóng để nâng cấp</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0d1117;
    color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
    text-align: center;
  }
  .card { max-width: 420px; }
  .icon { font-size: 56px; margin-bottom: 8px; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  p { color: #8b949e; line-height: 1.6; font-size: 15px; margin: 0 0 8px; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🛠️</div>
    <h1>Đố Kinh Thánh đang nâng cấp</h1>
    <p>Bản này tạm đóng để chuyển sang bản mới gộp chung "Tôi là ai?" và "Đoán ô chữ" vào một chỗ.</p>
    <p>Quay lại sau nhé — cảm ơn bạn đã chơi!</p>
  </div>
</body>
</html>
